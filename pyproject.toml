[project]
name = "chatbot-platform"
version = "0.1.0"
requires-python = "==3.12.*"

dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "httpx==0.27.2",
    "sqlalchemy==2.0.35",
    "alembic==1.13.3",
    "asyncpg==0.30.0",
    "langgraph==0.2.20",
    "pytest==8.3.3"
]
[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"] 
ignore = []